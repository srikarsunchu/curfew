<!doctype html><html lang="en" class="dark-theme"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nightlatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Frosted UI dark tokens, as used by Whop Desktop. Values extracted from frosted-ui/styles.css. */
:root{
  --gray-1:#111111;--gray-2:#191919;--gray-3:#222222;--gray-4:#2a2a2a;--gray-5:#313131;--gray-6:#3a3a3a;--gray-7:#484848;--gray-8:#606060;--gray-9:#6e6e6e;--gray-10:#7b7b7b;--gray-11:#b4b4b4;--gray-12:#eeeeee;
  --gray-a2:#ffffff09;--gray-a3:#ffffff12;--gray-a4:#ffffff1b;--gray-a5:#ffffff22;--gray-a6:#ffffff2c;--gray-a8:#ffffff55;
  --accent-9:#1754d8;--accent-10:#406cc8;--accent-11:#88b5ff;--accent-a3:#1161fd40;--accent-a4:#1a65fd5c;--accent-a6:#3576ff82;
  --success-9:#30a46c;--success-11:#3dd68c;--success-a3:#22ff991e;--success-a4:#11ff992d;
  --danger-9:#fd1d1d;--danger-11:#ff9081;--danger-a3:#fc070032;--danger-a4:#ff00004b;--danger-a6:#fe211671;
  --warning-9:#ffc53d;--warning-11:#ffca16;--warning-a3:#fa820022;--warning-a4:#fc820032;--warning-a6:#fd9b0051;
  --color-background:var(--gray-1);--color-panel-solid:var(--gray-2);--color-stroke:var(--gray-a4);
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:40px;
  --radius-3:6px;--radius-4:8px;--radius-5:12px;--radius-6:16px;
  --font-size-0:10px;--font-size-1:12px;--font-size-2:14px;--font-size-6:24px;
  --line-height-1:16px;--line-height-2:20px;--line-height-3:24px;
  --ls-1:0.005em;--ls-2:-0.005em;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  --mono:"Geist Mono","Menlo","Consolas",monospace;
  --ease:cubic-bezier(.4,0,.2,1);
  --shadow-2:0 0 0 1px var(--gray-a3),0 1px 1px 0 var(--gray-a4),0 1px 3px 0 #0000001a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--color-background);color:var(--gray-12);font:400 var(--font-size-2)/var(--line-height-2) var(--font);letter-spacing:var(--ls-2);-webkit-font-smoothing:antialiased}
button{font:inherit;letter-spacing:inherit;color:inherit;cursor:default}
.content{max-width:1120px;margin:0 auto;padding:0 var(--space-6) var(--space-7)}
.page{animation:page-in 200ms var(--ease) both}
@keyframes page-in{from{opacity:0}to{opacity:1}}

/* page header, as Whop Desktop */
.page-header{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-4);padding:var(--space-7) 0 var(--space-5)}
.h6{font-size:var(--font-size-6);line-height:var(--line-height-3);font-weight:500;letter-spacing:-0.01em;margin:0}
.sub{display:block;margin-top:var(--space-1);color:var(--gray-11);font-size:var(--font-size-2)}
.actions{display:flex;align-items:center;gap:var(--space-2)}

/* Frosted buttons */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:32px;padding:0 var(--space-3);border-radius:var(--radius-4);border:0;font-size:var(--font-size-2);font-weight:500;transition:background-color 150ms var(--ease),color 150ms var(--ease),transform 100ms var(--ease)}
.btn:active{transform:scale(.98)}
.btn.s1{height:24px;padding:0 var(--space-2);font-size:var(--font-size-1);border-radius:var(--radius-3)}
.btn.classic{background:var(--accent-9);color:#fff;box-shadow:inset 0 1px 0 #ffffff1f,0 1px 1px #0000004d}
.btn.classic:hover{background:var(--accent-10)}
.btn.surface{background:var(--gray-a2);color:var(--gray-12);box-shadow:inset 0 0 0 1px var(--gray-a5)}
.btn.surface:hover{background:var(--gray-a3)}
.btn.soft{background:var(--gray-a3);color:var(--gray-12)}
.btn.soft:hover{background:var(--gray-a4)}
.btn.danger{background:var(--danger-a3);color:var(--danger-11)}
.btn.danger:hover{background:var(--danger-a4)}
.btn svg{width:15px;height:15px;flex:none}
.btn.surface svg,.btn.soft svg{color:var(--gray-10)}

/* Frosted card, size 3 */
.card{background:var(--color-panel-solid);border-radius:var(--radius-6);padding:var(--space-5);box-shadow:var(--shadow-2)}
.card.s2{padding:var(--space-4)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-3)}
.h3{font-size:var(--font-size-2);line-height:var(--line-height-2);font-weight:500;margin:0}
.stack{display:flex;flex-direction:column;gap:var(--space-3)}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-3)}
.grid-2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:var(--space-3)}
@media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-2{grid-template-columns:minmax(0,1fr)}}

/* stat tile: label · value · badge + note */
.stat{display:flex;flex-direction:column;gap:var(--space-2)}
.t1{font-size:var(--font-size-1);line-height:var(--line-height-1);letter-spacing:var(--ls-1);color:var(--gray-11)}
.t0{font-size:var(--font-size-0);line-height:var(--line-height-1);letter-spacing:.01em;color:var(--gray-9)}
.stat-value{font-size:var(--font-size-6);line-height:var(--line-height-3);font-weight:500;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:var(--space-2)}
.stat-row{display:flex;align-items:baseline;gap:var(--space-2);min-height:var(--line-height-1)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:var(--font-size-1);letter-spacing:0;font-variant-numeric:tabular-nums}

/* badges, soft variant */
.badge{display:inline-flex;align-items:center;gap:var(--space-1);height:18px;padding:0 6px;border-radius:var(--radius-2,4px);font-size:var(--font-size-1);line-height:var(--line-height-1);font-weight:500;letter-spacing:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge.gray{background:var(--gray-a3);color:var(--gray-11)}
.badge.green{background:var(--success-a3);color:var(--success-11)}
.badge.amber{background:var(--warning-a3);color:var(--warning-11)}
.badge.red{background:var(--danger-a3);color:var(--danger-11)}
.badge.blue{background:var(--accent-a3);color:var(--accent-11)}

/* live dot as in the Whop Desktop sidebar */
.dot{display:inline-block;width:8px;height:8px;border-radius:999px;background:var(--success-9);box-shadow:0 0 0 3px var(--success-a3);flex:none}
.dot[data-level=elevated]{background:var(--warning-9);box-shadow:0 0 0 3px var(--warning-a3)}
.dot[data-level=attack]{background:var(--danger-9);box-shadow:0 0 0 3px var(--danger-a3)}
.dot[data-level=unlearned]{background:var(--gray-8);box-shadow:none}

/* chart, Frosted style */
.chart{position:relative;width:100%;height:200px;margin-top:var(--space-2)}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart-grid{stroke:var(--gray-a4);stroke-width:1}
.chart-axis{fill:var(--gray-9);font-size:var(--font-size-0);font-family:var(--font)}
.bar-paid{fill:var(--accent-9)}.bar-fail{fill:var(--danger-9);opacity:.85}
.bar{transform-origin:bottom;animation:bar-in 300ms var(--ease) both}
@keyframes bar-in{from{transform:scaleY(0)}}
.chart-mark{stroke:var(--danger-9);stroke-width:1;stroke-dasharray:2 3}
.legend{display:flex;gap:var(--space-4);margin-top:var(--space-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}

/* signal ledger: the anchor. label col | now | usual | verdict */
.ledger{display:grid;grid-template-columns:16px 104px minmax(0,1fr) auto;column-gap:var(--space-3);row-gap:0}
.ledger>div{padding:10px 0;border-top:1px solid var(--color-stroke);display:flex;align-items:center;min-height:40px}
.ledger>div:nth-child(-n+4){border-top:0;padding-top:0}
.ledger .name{font-weight:500}
.ledger .note{color:var(--gray-11);font-size:var(--font-size-1);line-height:var(--line-height-1)}
.ledger .ind{width:8px;height:8px;border-radius:999px;background:var(--gray-6)}
.ledger .ind[data-on]{background:var(--danger-9);box-shadow:0 0 0 3px var(--danger-a3)}

/* tables, Frosted */
.table-clip{overflow:auto;margin:0 calc(var(--space-5) * -1) calc(var(--space-5) * -1)}
table{width:100%;border-collapse:collapse;font-size:var(--font-size-2)}
th{text-align:left;font-weight:400;color:var(--gray-11);font-size:var(--font-size-1);line-height:var(--line-height-1);padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--color-stroke);white-space:nowrap}
td{padding:0 var(--space-3);height:40px;border-bottom:1px solid var(--color-stroke);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{padding-left:var(--space-5)}th:last-child,td:last-child{padding-right:var(--space-5)}
tr[data-clickable]{transition:background-color 150ms var(--ease)}tr[data-clickable]:hover td{background:var(--gray-a2)}
tr[data-selected] td{background:var(--gray-a3)}
td.right,th.right{text-align:right}
.cell-user{display:flex;align-items:center;gap:var(--space-2);min-width:0}
.avatar{width:24px;height:24px;border-radius:var(--radius-3);background:var(--gray-4);color:var(--gray-11);font-size:var(--font-size-0);font-weight:500;display:inline-flex;align-items:center;justify-content:center;flex:none;letter-spacing:0}
.cell-user-text{display:flex;flex-direction:column;min-width:0;line-height:var(--line-height-1)}
.cell-user-text small{color:var(--gray-9);font-size:var(--font-size-0);font-family:var(--mono)}
.insights{padding:var(--space-2) var(--space-5) var(--space-3) 60px !important;height:auto !important;white-space:normal !important;background:var(--gray-a2)}
.insights ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:var(--font-size-1);line-height:var(--line-height-1);color:var(--gray-11)}
.insights li::before{content:"";display:inline-block;width:4px;height:4px;border-radius:999px;background:var(--gray-8);margin:0 8px 2px 0}
.insights li[data-bad]::before{background:var(--danger-9)}
.empty{padding:var(--space-6) var(--space-5);text-align:center;color:var(--gray-9);font-size:var(--font-size-1)}
.kv{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--space-3)}
.kv b{display:block;font-weight:500;font-variant-numeric:tabular-nums}
.demo{display:inline-flex;align-items:center;gap:var(--space-1);padding:2px 2px 2px var(--space-2);border-radius:var(--radius-4);background:var(--gray-a2);box-shadow:inset 0 0 0 1px var(--gray-a4)}
.demo .t0{margin-right:var(--space-1)}
@media(prefers-reduced-motion:reduce){.page,.bar{animation:none}}

const usd=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n);
const pct=n=>Math.round(n*100)+'%';
const NAMES={velocity:'Velocity',new_buyers:'New buyers',declines:'Declines',geo_spread:'Geography',card_reuse:'Card reuse',spend_shift:'Spend'};
const riskColor=r=>r>=60?'red':r>=30?'amber':'green';
let selected=null,firstPaint=true;

function tiles(s){
 const lv=s.last?.level||(s.baseline?'normal':'unlearned');const fired=(s.last?.signals||[]).filter(x=>x.fired);
 const paidWin=s.scored.filter(p=>p.status==='paid');const failWin=s.scored.filter(p=>p.status!=='paid');
 const hold=s.incidents.find(i=>i.status==='holding');const held=hold?s.scored.filter(p=>hold.suspect_ids.includes(p.id)):[];
 const usualRate=s.baseline?Math.max(s.baseline.overall_rate*0.5,(s.baseline.rate_by_hour[new Date().getUTCHours()]||{mean:0}).mean):0;
  const t=(label,value,row)=>`<div class="card"><div class="stat"><span class="t1">${label}</span><div class="stat-value">${value}</div><div class="stat-row">${row}</div></div></div>`;
 $('#tiles').innerHTML=
  t('State',`<span class="dot" data-level="${lv}"></span>${lv==='unlearned'?'—':lv[0].toUpperCase()+lv.slice(1)}`,`<span class="badge ${lv==='attack'?'red':lv==='elevated'?'amber':lv==='normal'?'green':'gray'}">${fired.length} of 6 signals</span><span class="t1">${s.last?`since ${time(s.last.at)}`:'waiting for payments'}</span>`)+
  t(`Paid, last ${s.config.windowMin} min`,paidWin.length,`<span class="t1">usual ${usualRate.toFixed(usualRate<1?2:0)} · ${usd(paidWin.reduce((a,p)=>a+p.usd_total,0))}</span>`)+
  t('Declined',failWin.length,`${failWin.length+paidWin.length?`<span class="badge ${failWin.length/(failWin.length+paidWin.length)>0.3?'red':'gray'}">${pct(failWin.length/(failWin.length+paidWin.length))}</span>`:''}<span class="t1">of attempts</span>`)+
  t('Held for refund',hold?hold.suspect_ids.length:0,hold?`<span class="badge amber">acts ${time(hold.act_at)}</span><span class="t1">${usd(held.reduce((a,p)=>a+p.usd_total,0))}</span>`:`<span class="t1">nothing held</span>`);
}
function chart(s){
 const now=Date.now(),mins=Array.from({length:60},()=>({n:0,f:0,ids:[]}));
 for(const p of s.recent){const i=59-Math.floor((now-new Date(p.created_at))/60000);if(i<0||i>59)continue;p.status==='paid'?mins[i].n++:mins[i].f++;}
 const W=640,H=200,padL=28,padB=18,iw=W-padL,ih=H-padB,mx=Math.max(4,...mins.map(m=>m.n+m.f));
 const bw=iw/60,gy=v=>ih-(v/mx)*ih;const ticks=[0,Math.round(mx/2),mx];
 let g=ticks.map(v=>`<line class="chart-grid" x1="${padL}" x2="${W}" y1="${gy(v)}" y2="${gy(v)}"/><text class="chart-axis" x="${padL-6}" y="${gy(v)+3}" text-anchor="end">${v}</text>`).join('');
 const opened=s.incidents.filter(i=>i.level==='attack'&&now-new Date(i.opened_at)<3600e3).map(i=>59-Math.floor((now-new Date(i.opened_at))/60000));
 let bars='';mins.forEach((m,i)=>{const x=padL+i*bw+1,w=Math.max(2,bw-2);
  if(m.n)bars+=`<rect class="bar bar-paid" x="${x}" y="${gy(m.n)}" width="${w}" height="${ih-gy(m.n)}" rx="1.5" style="animation-delay:${firstPaint?i*4:0}ms"/>`;
  if(m.f)bars+=`<rect class="bar bar-fail" x="${x}" y="${gy(m.n+m.f)}" width="${w}" height="${gy(m.n)-gy(m.n+m.f)}" rx="1.5" style="animation-delay:${firstPaint?i*4:0}ms"/>`;});
 const marks=opened.filter(i=>i>=0).map(i=>`<line class="chart-mark" x1="${padL+i*bw+bw/2}" x2="${padL+i*bw+bw/2}" y1="0" y2="${ih}"/>`).join('');
 const ax=[0,20,40,59].map(i=>`<text class="chart-axis" x="${padL+i*bw+bw/2}" y="${H-4}" text-anchor="middle">${time(now-(59-i)*60000)}</text>`).join('');
 $('#chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}${bars}${marks}${ax}</svg>`;
 $('#mark-legend').hidden=!opened.length;
 const paid=s.recent.filter(p=>p.status==='paid');$('#chart-meta').textContent=`${paid.length} paid · ${s.recent.length-paid.length} declined · ${usd(paid.reduce((a,p)=>a+p.usd_total,0))}`;
}
function ledger(s){
 const sig=s.last?.signals||[];$('#sig-meta').textContent=s.last?`checked ${time(s.last.at)}`:'';
 $('#ledger').innerHTML=sig.length?sig.map(x=>`<div><i class="ind" ${x.fired?'data-on':''}></i></div><div class="name">${NAMES[x.name]||x.name}</div><div class="note">${esc(x.note)}</div><div class="mono" style="color:${x.fired?'var(--danger-11)':'var(--gray-9)'}">${x.value} / ${x.threshold}</div>`).join(''):'<div class="t1" style="grid-column:1/-1;border:0">Waiting for the first payment.</div>';
}
function payments(s){
 const rows=s.scored;$('#pay-meta').textContent=rows.length?`${rows.length} in the last ${s.config.windowMin} min`:'';
 if(!rows.length){$('#payments').innerHTML='<div class="empty">No payments in the window.</div>';return;}
 $('#payments').innerHTML=`<table><thead><tr><th>Time</th><th>Customer</th><th class="right">Amount</th><th>Country</th><th>Card</th><th>Status</th><th class="right">Risk</th><th>Insight</th></tr></thead><tbody>${rows.map(p=>{
  const nm=p.user_name||p.user_id||'Guest';const initials=nm.includes('@')?nm[0].toUpperCase():nm.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();const sel=selected===p.id;
  return `<tr data-clickable ${sel?'data-selected':''} data-id="${esc(p.id)}"><td class="num t1" style="color:var(--gray-11)">${time(p.created_at)}</td>
  <td><div class="cell-user"><span class="avatar">${esc(initials)}</span><div class="cell-user-text"><span>${esc(nm)}</span><small>${esc(p.id)}</small></div></div></td>
  <td class="right num">${p.status==='paid'?usd(p.usd_total):'<span style="color:var(--gray-9)">—</span>'}</td><td>${esc(p.country||'—')}</td>
  <td class="mono" style="color:var(--gray-11)">${p.card_last4?'•••• '+esc(p.card_last4):'—'}</td>
  <td>${p.refunded_at?'<span class="badge gray">Refunded</span>':p.status==='paid'?'<span class="badge green">Paid</span>':`<span class="badge red">${esc(p.decline_code||'Declined')}</span>`}</td>
  <td class="right"><span class="badge ${riskColor(p.risk)}">${p.risk}</span></td>
  <td class="t1" style="color:var(--gray-11);max-width:280px;overflow:hidden;text-overflow:ellipsis">${esc(p.insights[0]||'')}</td></tr>${sel?`<tr><td colspan="8" class="insights"><ul>${p.insights.map(i=>`<li ${/unusual|different|tried|Declined|spike|burst|First/.test(i)?'data-bad':''}>${esc(i)}</li>`).join('')}</ul></td></tr>`:''}`;}).join('')}</tbody></table>`;
 document.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>{selected=selected===tr.dataset.id?null:tr.dataset.id;render(last);});
}
function incidents(s){
 $('#inc-meta').textContent=s.incidents.length?`${s.incidents.length} recorded`:'';
 if(!s.incidents.length){$('#incidents').innerHTML='<div class="empty">Nothing has tripped.</div>';return;}
 const st={holding:'amber',acted:'red',undone:'gray',alerted:'blue'};
 $('#incidents').innerHTML=`<table><thead><tr><th>Opened</th><th>Status</th><th>Level</th><th>Signals</th><th class="right">Suspects</th><th>Result</th><th></th></tr></thead><tbody>${s.incidents.map(i=>`<tr><td class="num t1" style="color:var(--gray-11)">${time(i.opened_at)}</td>
  <td><span class="badge ${st[i.status]||'gray'}">${i.status[0].toUpperCase()+i.status.slice(1)}</span></td><td>${i.level[0].toUpperCase()+i.level.slice(1)} <span class="mono" style="color:var(--gray-9)">${i.score}/6</span></td>
  <td class="t1" style="color:var(--gray-11)">${i.signals.filter(x=>x.fired).map(x=>NAMES[x.name]||x.name).join(', ')}</td><td class="right num">${i.suspect_ids.length}</td>
  <td class="t1" style="color:var(--gray-11)">${i.status==='holding'?`Refund and revoke at ${time(i.act_at)}`:i.acted?`${i.acted.refunded.length} refunded · ${i.acted.revoked.length} revoked${i.acted.errors.length?` · ${i.acted.errors.length} errors`:''}`:i.status==='undone'?'Cancelled by you':'Alert only'}</td>
  <td class="right">${i.status==='holding'?`<button class="btn classic s1" onclick="post('/api/undo/${i.id}').then(load)">This is legitimate</button>`:''}</td></tr>`).join('')}</tbody></table>`;
}
function baseline(s){
 const b=s.baseline;if(!b){$('#baseline').innerHTML='<span style="grid-column:1/-1">Not learned yet. Run <span class="mono">npm run learn</span>.</span>';return;}
 const perDay=b.overall_rate*(1440/s.config.windowMin);const top=Object.entries(b.country_share).sort((a,z)=>z[1]-a[1]).slice(0,3).map(([c,v])=>`${c} ${Math.round(v*100)}%`).join(' · ');
 $('#base-meta').textContent=`learned ${new Date(b.learned_at).toLocaleDateString([],{month:'short',day:'numeric'})} from ${b.total_paid.toLocaleString()} payments over ${b.days} days`;
 const kv=(k,v)=>`<div><span>${k}</span><b>${v}</b></div>`;
 $('#baseline').innerHTML=kv('Paid per day',perDay.toFixed(0))+kv('Average order',usd(b.avg_usd))+kv('First-time buyers',pct(b.new_buyer_share))+kv('Decline rate',pct(b.decline_share))+kv('Sells to',top)+kv('Window',`${s.config.windowMin} min`);
}
function header(s){
 const lv=s.last?.level;$('#sub').textContent=[s.config.dryRun?'Northwind Picks (demo)':'Connected to Whop',s.baseline?`${s.baseline.total_paid.toLocaleString()} payments learned`:'baseline not learned',`refunds hold ${s.config.refundDelayMin} min`].join(' · ');
 const launch=s.launch_until?`<button class="btn surface" onclick="post('/api/launch',{hours:0}).then(load)">${I.rocket}End launch mode · until ${time(s.launch_until)}</button>`:`<button class="btn surface" onclick="post('/api/launch',{hours:2}).then(load)">${I.rocket}I'm launching</button>`;
 const demo=s.config.dryRun?`<span class="demo"><span class="t0">DEMO</span><button class="btn soft s1" onclick="post('/api/simulate',{kind:'attack'}).then(load)">${I.bolt}Card-testing attack</button><button class="btn soft s1" onclick="post('/api/simulate',{kind:'launch'}).then(load)">${I.play}Real launch</button><button class="btn soft s1" onclick="post('/api/simulate',{kind:'reset'}).then(()=>{selected=null;load()})">${I.reset}Reset</button></span>`:'';
 $('#actions').innerHTML=demo+launch;
}
let last=null;
function render(s){last=s;header(s);tiles(s);chart(s);ledger(s);payments(s);incidents(s);baseline(s);firstPaint=false;}
async function load(){render(await fetch('/api/state').then(r=>r.json()));}
load();setInterval(load,5000);
</script></body></html>
